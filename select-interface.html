<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Interfaz de red</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 24px; background: #f7f7f9; color: #25273d;
        }
        h1 { font-size: 17px; margin: 0 0 8px; }
        p { font-size: 13px; line-height: 1.5; color: #6b6c7e; margin: 0 0 16px; }
        .stale {
            font-size: 13px; background: #fff4e5; border: 1px solid #ffd7a0;
            border-radius: 8px; padding: 10px 12px; margin: 0 0 16px; color: #8a5300;
        }
        button {
            display: block; width: 100%; text-align: left; cursor: pointer;
            background: #fff; border: 1px solid #d8d9e0; border-radius: 10px;
            padding: 12px 14px; margin-bottom: 10px; font-size: 14px; color: #25273d;
        }
        button:hover { border-color: #0666eb; background: #f3f8ff; }
        button:disabled { opacity: 0.5; cursor: default; }
        button:disabled:hover { border-color: #d8d9e0; background: #fff; }
        .iface { font-weight: 600; }
        .addr { color: #6b6c7e; }
        .current { color: #0666eb; font-weight: 600; }
    </style>
</head>
<body>
    <h1>Elige la interfaz de red de este puesto</h1>
    <p>
        El SGA identifica este puesto por su direcci&oacute;n IP. Este equipo tiene varias,
        as&iacute; que hay que indicar cu&aacute;l se usa.
    </p>
    <div id="stale" class="stale" style="display: none;"></div>
    <div id="list"></div>

    <script>
        const stale = document.getElementById('stale');
        const list = document.getElementById('list');

        // Blocks a second click from firing a second invoke while the first is
        // still in flight — an impatient double-click must not race the main
        // process, which may already be closing this window by the time the
        // second click would otherwise land.
        function setButtonsDisabled(disabled) {
            for (const button of list.querySelectorAll('button')) {
                button.disabled = disabled;
            }
        }

        // Shared by both failure paths below: a resolved {saved:false} and a
        // rejected invoke look different to the code but must look the same
        // to the operator.
        function showSaveFailure() {
            stale.textContent =
                'No se pudo guardar la elección. Inténtalo de nuevo o avisa a soporte.';
            stale.style.display = 'block';
        }

        // Reason-specific: the no-network case has nothing to plug into, while a
        // stale save that also has nothing left to offer is a different situation
        // (something was chosen before, and that something is gone too).
        function emptyCandidatesMessage(reason) {
            if (reason === 'stale') {
                return 'Este equipo no tiene ninguna otra interfaz de red disponible. '
                    + 'Conecta un cable de red o activa el wifi, y vuelve a abrir esta '
                    + 'ventana desde la bandeja del sistema.';
            }

            return 'Este equipo no tiene ninguna interfaz de red disponible ahora mismo. '
                + 'Conecta un cable de red o activa el wifi, y vuelve a abrir esta ventana '
                + 'desde la bandeja del sistema.';
        }

        // A rejected "not_offered": the candidate list itself changed since this
        // dialog was rendered (a cable pulled, wifi toggled) — retrying the same
        // button can never succeed, so the fix is to show what is actually available
        // now, not to ask for another click on the same list.
        async function handleSaveFailure(reason) {
            if (reason === 'not_offered') {
                const fresh = await window.electronAPI.getInterfaceChoice();
                applyChoice(fresh);
                return;
            }

            // A genuine write failure (disk, permissions, ...): the candidate itself
            // is still valid, so leaving the same buttons on screen and asking to
            // retry is the right advice here, unlike the not_offered case above.
            showSaveFailure();
            setButtonsDisabled(false);
        }

        // Rebuilds the candidate list from scratch. Used both for the initial render
        // and for the re-render after a not_offered rejection, so a disappearing
        // interface produces exactly the same result it would on a fresh open of
        // this window.
        function renderCandidates(candidates, currentInterface, reason) {
            list.textContent = '';

            if (candidates.length === 0) {
                const empty = document.createElement('p');
                empty.textContent = emptyCandidatesMessage(reason);
                list.appendChild(empty);
                return;
            }

            for (const candidate of candidates) {
                const button = document.createElement('button');

                // Interface and address together: the interface name alone means nothing
                // to an operator, and the address alone does not distinguish cable from
                // wifi, which is exactly the choice being made.
                const iface = document.createElement('span');
                iface.className = 'iface';
                iface.textContent = candidate.name;

                const addr = document.createElement('span');
                addr.className = 'addr';
                addr.textContent = ' · ' + candidate.address;

                button.append(iface, addr);

                // Mark which one is currently in effect, so reopening the dialog
                // from the tray on an already-configured machine does not ask the
                // operator to choose blind.
                if (currentInterface && candidate.name === currentInterface) {
                    const current = document.createElement('span');
                    current.className = 'current';
                    current.textContent = ' (en uso)';
                    button.append(current);
                }

                button.addEventListener('click', async () => {
                    setButtonsDisabled(true);

                    try {
                        const result = await window.electronAPI.chooseInterface(candidate.name);

                        // A failure leaves this window open on purpose: the main process
                        // already logged why, but the operator standing in front of the
                        // screen still needs to see that nothing happened. Reusing the
                        // #stale element (and textContent, never innerHTML) keeps this
                        // consistent with the rest of the dialog and safe against odd
                        // input, whatever the reason turns out to be.
                        if (!result || !result.saved) {
                            await handleSaveFailure(result && result.reason);
                        }
                        // On success the main process closes this window itself.
                    } catch (error) {
                        // A rejected invoke (the main process handler threw, or the IPC
                        // channel itself failed) must reach the operator exactly like a
                        // resolved {saved:false} does — this is the failure mode
                        // addition #1's try/catch exists to prevent, reached from the
                        // renderer side instead of the main-process side.
                        await handleSaveFailure(undefined);
                    }
                });

                list.appendChild(button);
            }
        }

        // Single place that reconciles the stale banner and the candidate list from
        // one `getInterfaceChoice()` result — called for the initial load and again
        // after a not_offered rejection, so both paths stay in sync.
        function applyChoice(choice) {
            if (choice.reason === 'stale' && choice.savedInterface) {
                const base = 'La interfaz elegida antes (' + choice.savedInterface
                    + ') ya no existe en este equipo.';
                stale.textContent = choice.candidates.length > 0 ? base + ' Elige otra.' : base;
                stale.style.display = 'block';
            } else {
                stale.style.display = 'none';
            }

            renderCandidates(choice.candidates, choice.currentInterface, choice.reason);
        }

        (async () => {
            const choice = await window.electronAPI.getInterfaceChoice();
            applyChoice(choice);
        })();
    </script>
</body>
</html>
