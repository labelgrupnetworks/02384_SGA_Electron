<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Interfaz de red</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 24px; background: #f7f7f9; color: #25273d;
        }
        h1 { font-size: 17px; margin: 0 0 8px; }
        p { font-size: 13px; line-height: 1.5; color: #6b6c7e; margin: 0 0 16px; }
        .stale {
            font-size: 13px; background: #fff4e5; border: 1px solid #ffd7a0;
            border-radius: 8px; padding: 10px 12px; margin: 0 0 16px; color: #8a5300;
        }
        button {
            display: block; width: 100%; text-align: left; cursor: pointer;
            background: #fff; border: 1px solid #d8d9e0; border-radius: 10px;
            padding: 12px 14px; margin-bottom: 10px; font-size: 14px; color: #25273d;
        }
        button:hover { border-color: #0666eb; background: #f3f8ff; }
        button:disabled { opacity: 0.5; cursor: default; }
        button:disabled:hover { border-color: #d8d9e0; background: #fff; }
        .iface { font-weight: 600; }
        .addr { color: #6b6c7e; }
        .current { color: #0666eb; font-weight: 600; }
    </style>
</head>
<body>
    <h1>Elige la interfaz de red de este puesto</h1>
    <p>
        El SGA identifica este puesto por su direcci&oacute;n IP. Este equipo tiene varias,
        as&iacute; que hay que indicar cu&aacute;l se usa.
    </p>
    <div id="stale" class="stale" style="display: none;"></div>
    <div id="list"></div>

    <script>
        (async () => {
            const choice = await window.electronAPI.getInterfaceChoice();
            const stale = document.getElementById('stale');

            if (choice.reason === 'stale' && choice.savedInterface) {
                stale.textContent =
                    'La interfaz elegida antes (' + choice.savedInterface + ') ya no existe en este equipo. '
                    + 'Elige otra.';
                stale.style.display = 'block';
            }

            const list = document.getElementById('list');

            // Shared by both failure paths below: a resolved {saved:false} and a
            // rejected invoke look different to the code but must look the same
            // to the operator.
            function showSaveFailure() {
                stale.textContent =
                    'No se pudo guardar la elección. Inténtalo de nuevo o avisa a soporte.';
                stale.style.display = 'block';
            }

            // Blocks a second click from firing a second invoke while the first is
            // still in flight — an impatient double-click must not race the main
            // process, which may already be closing this window by the time the
            // second click would otherwise land.
            function setButtonsDisabled(disabled) {
                for (const button of list.querySelectorAll('button')) {
                    button.disabled = disabled;
                }
            }

            for (const candidate of choice.candidates) {
                const button = document.createElement('button');

                // Interface and address together: the interface name alone means nothing
                // to an operator, and the address alone does not distinguish cable from
                // wifi, which is exactly the choice being made.
                const iface = document.createElement('span');
                iface.className = 'iface';
                iface.textContent = candidate.name;

                const addr = document.createElement('span');
                addr.className = 'addr';
                addr.textContent = ' · ' + candidate.address;

                button.append(iface, addr);

                // Mark which one is currently in effect, so reopening the dialog
                // from the tray on an already-configured machine does not ask the
                // operator to choose blind.
                if (choice.currentInterface && candidate.name === choice.currentInterface) {
                    const current = document.createElement('span');
                    current.className = 'current';
                    current.textContent = ' (en uso)';
                    button.append(current);
                }

                button.addEventListener('click', async () => {
                    setButtonsDisabled(true);

                    try {
                        const result = await window.electronAPI.chooseInterface(candidate.name);

                        // A failed write leaves this window open on purpose: the main
                        // process already logged why, but the operator standing in front
                        // of the screen still needs to see that nothing happened. Reusing
                        // the #stale element (and textContent, never innerHTML) keeps this
                        // consistent with the rest of the dialog and safe against odd input.
                        if (!result || !result.saved) {
                            showSaveFailure();
                            setButtonsDisabled(false);
                        }
                        // On success the main process closes this window itself.
                    } catch (error) {
                        // A rejected invoke (the main process handler threw, or the IPC
                        // channel itself failed) must reach the operator exactly like a
                        // resolved {saved:false} does — this is the failure mode
                        // addition #1's try/catch exists to prevent, reached from the
                        // renderer side instead of the main-process side.
                        showSaveFailure();
                        setButtonsDisabled(false);
                    }
                });

                list.appendChild(button);
            }
        })();
    </script>
</body>
</html>
