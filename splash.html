<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cargando...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: rgb(85, 85, 85);
      overflow: hidden;
    }
    .logo {
      width: 150px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    .loading-text {
      font-size: 18px;
      margin-top: 20px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      /* Verentia green, #86ba3b — the same $primary the SGA's riho theme uses, so the
         desktop app and the web app do not look like two different products. It used
         to be #B31983, which was Fedefarma's magenta. */
      border: 5px solid rgba(134, 186, 59, 0.4);
      border-radius: 50%;
      border-top-color: #86ba3b;
      animation: spin 1s ease-in-out infinite;
      margin-top: 20px;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .version {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="Logo" class="logo">
  <div class="loading-text">Iniciando servidor, sea paciente...</div>
  <div class="loading-spinner"></div>
  <div class="version" id="version"></div>

  <script>
    // The version comes from the main process, which reads it with app.getVersion() —
    // that is package.json's version, so a release bump can never leave this label
    // behind. It starts empty on purpose: a hardcoded number here is what made the
    // splash claim v1.1.0 while the app was already on 1.3.x.
    window.addEventListener('DOMContentLoaded', async () => {
      const element = document.getElementById('version');

      try {
        element.textContent = `v${await window.electronAPI.getVersion()}`;
      } catch (error) {
        // No version is better than a wrong one: this label is what someone reads out
        // over the phone when a workstation misbehaves.
        element.textContent = '';
      }
    });
  </script>
</body>
</html>
